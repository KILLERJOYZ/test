services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: lua
      POSTGRES_PASSWORD: lua
      POSTGRES_DB: lua
    ports:
      - "54329:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lua -d lua"]
      interval: 5s
      timeout: 5s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "6335:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200\" <&3'"]
      interval: 5s
      timeout: 5s
      retries: 20
