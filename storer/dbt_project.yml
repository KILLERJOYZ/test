name: 'storer_dbt'
version: '1.0.0'
config-version: 2

# Profile cấu hình kết nối database trong profiles.yml
profile: 'storer_postgres'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  storer_dbt:
    staging:
      +materialized: view
      +schema: public
    marts:
      +materialized: incremental
      +schema: public
