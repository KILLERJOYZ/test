version: 2

sources:
  - name: raw
    schema: public
    tables:
      - name: raw_crawled_laptops
        description: "Bảng chứa payload JSON thô thu thập từ crawler"
        columns:
          - name: id
            description: "Khóa chính băm cố định (SHA-256)"
            tests:
              - unique
              - not_null
          - name: source
            description: "Nguồn crawl (cellphones, fptshop, ...)"
            tests:
              - not_null
          - name: crawled_at
            description: "Thời gian cào dữ liệu"
            tests:
              - not_null
          - name: payload
            description: "Dữ liệu JSON chi tiết của laptop"

models:
  - name: stg_laptops
    description: "Model staging parse các trường từ JSONB của raw_crawled_laptops"
    columns:
      - name: id
        description: "ID laptop duy nhất"
        tests:
          - unique
          - not_null
      - name: price_current
        description: "Giá bán hiện tại VND"
      - name: crawled_at
        description: "Thời điểm cào dữ liệu"
